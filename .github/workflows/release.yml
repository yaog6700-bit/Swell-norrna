name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install & Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package dist
        run: |
          tar -czf dist.tar.gz -C web dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist.tar.gz
          retention-days: 1

  linux:
    needs: build-frontend
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            realm: realm-x86_64-unknown-linux-musl.tar.gz
            unprefixed: true
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            realm: realm-aarch64-unknown-linux-musl.tar.gz
            unprefixed: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          set -e
          # Download realm agent
          curl -fL --retry 5 -o realm.tar.gz \
            "https://github.com/zhboner/realm/releases/download/v2.9.6/${{ matrix.realm }}"
          tar -xzf realm.tar.gz
          chmod +x realm

          # Copy binaries with arch suffix
          cp -f "target/${{ matrix.target }}/release/norrna" "norrna-${{ matrix.suffix }}"
          cp -f "target/${{ matrix.target }}/release/norrna-manager" "norrna-manager-${{ matrix.suffix }}"
          cp -f realm "realm-${{ matrix.suffix }}"
          chmod +x "norrna-${{ matrix.suffix }}" "norrna-manager-${{ matrix.suffix }}" "realm-${{ matrix.suffix }}"

          # For amd64 also make unprefixed copies
          if [ "${{ matrix.unprefixed }}" = "true" ]; then
            cp -f "norrna-${{ matrix.suffix }}" norrna
            cp -f "norrna-manager-${{ matrix.suffix }}" norrna-manager
            cp -f "realm-${{ matrix.suffix }}" realm
            ./norrna-manager --version || true
          fi

      - name: Upload arch binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}
          files: |
            norrna-${{ matrix.suffix }}
            norrna-manager-${{ matrix.suffix }}
            realm-${{ matrix.suffix }}
            dist.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload amd64 aliases
        if: matrix.unprefixed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}
          files: |
            norrna
            norrna-manager
            realm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
      - run: mkdir -p web/dist && tar -xzf dist.tar.gz --strip-components=1 -C web/dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/swell-norrna
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max